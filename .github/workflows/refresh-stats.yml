name: Refresh profile stats

on:
  schedule:
    # Daily at 03:17 UTC (offset to avoid the GitHub Actions cron rush hour)
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Generate stats SVGs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/generate-stats.py

      - name: Commit if changed
        run: |
          git config user.name "hatim"
          git config user.email "106043141+hatimhtm@users.noreply.github.com"
          git add assets/stats-card.svg assets/languages-card.svg
          if git diff --cached --quiet; then
            echo "No stat changes — skipping commit."
          else
            git commit -m "chore: refresh profile stats"
            git push
          fi
