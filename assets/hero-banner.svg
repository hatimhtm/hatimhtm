<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Hatim El Hassak — Full-Stack Engineer">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1A1A1A" stroke-width="0.5" stroke-opacity="0.06"/>
    </pattern>
    <style>
      .heading { font-family: 'Helvetica Neue', 'Arial Black', Helvetica, Arial, sans-serif; font-weight: 900; }
      .mono    { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace; font-weight: 700; }
    </style>
  </defs>

  <rect width="1280" height="400" fill="#FFFDF5"/>
  <rect width="1280" height="400" fill="url(#grid)"/>

  <!-- Top acid marquee strip -->
  <rect x="0" y="0" width="1280" height="36" fill="#CCFF00"/>
  <line x1="0" y1="36" x2="1280" y2="36" stroke="#1A1A1A" stroke-width="3"/>
  <text class="mono" x="640" y="24" text-anchor="middle" font-size="12" fill="#1A1A1A" letter-spacing="6">FULL-STACK ENGINEER /// iOS · AI · WEB /// REMOTE WORLDWIDE /// TAKING NEW WORK ///</text>

  <!-- Eyebrow -->
  <text class="mono" x="60" y="100" font-size="13" fill="#1A1A1A" letter-spacing="6">PORTFOLIO / 2026</text>

  <!-- Big name -->
  <text class="heading" x="60" y="220" font-size="130" fill="#1A1A1A" letter-spacing="-6">HATIM</text>
  <text class="heading" x="60" y="335" font-size="130" fill="#1A1A1A" letter-spacing="-6">EL HASSAK<tspan fill="#CCFF00">.</tspan></text>

  <!-- Acid accent square (portfolio signature) -->
  <rect x="1080" y="80" width="140" height="140" fill="#CCFF00" stroke="#1A1A1A" stroke-width="6"/>
  <text class="mono" x="1150" y="138" text-anchor="middle" font-size="13" fill="#1A1A1A" letter-spacing="2">OPEN</text>
  <text class="mono" x="1150" y="158" text-anchor="middle" font-size="13" fill="#1A1A1A" letter-spacing="2">FOR</text>
  <text class="mono" x="1150" y="178" text-anchor="middle" font-size="13" fill="#1A1A1A" letter-spacing="2">WORK</text>

  <!-- Bottom mono line -->
  <text class="mono" x="60" y="378" font-size="12" fill="#1A1A1A" letter-spacing="4">/// 2 APPS LIVE ON THE APP STORE /// 30+ REPOS SHIPPED /// AVAILABLE WORLDWIDE ///</text>
</svg>
